server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: route3d-bus-management
  
  datasource:
    # Uses MySQL by default if DB_URL is set, otherwise persists cleanly to local file db
    url: ${DB_URL:jdbc:h2:file:./data/bus_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dummy@gmail.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT & Security Configuration
app:
  jwt:
    secret: ${JWT_SECRET:Route3DSecretKeyForTelanganaAndAPBusBookingSystem2026SecureKey!}
    expiration-ms: 86400000 # 24 hours
    issuer: Route3D-Auth-Service

# Logging
logging:
  level:
    com.route3d.busmanagement: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
